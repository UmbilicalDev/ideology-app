[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ideology-app"
version = "0.1.0"
description = "AI-generated voting advice application for Spanish general elections."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "click>=8.1",
    "anthropic>=1.15,<2",
    "pydantic>=2",
]

[project.scripts]
ideology = "ideology_app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
